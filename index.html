<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Menu dropdown ngang</title>
    <style>
        /* 1. Ba bộ chọn: phông chữ, vùng menu, xóa lề mặc định */
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        #menu {
            height: 40px;
            border: 1px solid #222;
            margin: 20px 0;
            background-color: #333;
        }

        #menu ul,
        #menu li {
            margin: 0;
            padding: 0;
        }

        /* 2. Các mục trong danh sách: xếp ngang */
        #menu li {
            list-style: none;
            float: left;
            /* xếp các mục nằm ngang */
            position: relative;
            /* làm mốc cho menu con */
        }

        /* 3. Liên kết trong menu */
        #menu a {
            display: block;
            /* cả ô đều bấm được, nhận được width/height */
            width: 120px;
            height: 40px;
            line-height: 40px;
            /* chữ nằm giữa theo chiều dọc */
            text-align: center;
            color: white;
            text-decoration: none;
            background-color: #333;
        }

        /* 4. Rê chuột vào liên kết thì nền chuyển đỏ */
        #menu a:hover {
            background-color: red;
        }

        /* 5. Menu con: thả xuống ngay dưới mục cha, ẩn mặc định */
        #menu ul ul {
            position: absolute;
            top: 40px;
            /* bằng chiều cao mục cha */
            left: 0;
            visibility: hidden;
        }

        /* Các mục của menu con xếp dọc, không nằm ngang */
        #menu ul ul li {
            float: none;
        }

        /* 6. Hiện menu con khi rê chuột vào mục cha */
        #menu li:hover>ul {
            visibility: visible;
        }
    </style>
</head>

<body>
    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Sản phẩm ▾</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Phụ kiện</a></li>
                </ul>
            </li>
            <li><a href="#">Dịch vụ ▾</a>
                <ul>
                    <li><a href="#">Sửa chữa</a></li>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Cài đặt</a></li>
                </ul>
            </li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

    <p>Rê chuột vào "Sản phẩm" hoặc "Dịch vụ" để thấy menu con thả xuống.</p>
</body>

</html>
